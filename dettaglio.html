<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cineMante - Dettaglio Film</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo-container">
            <img src="img/cinemante_logo.png" alt="cineMante Logo" class="logo-img">
        </div>
        <nav>
            <a href="index.html" class="nav-link">← TORNA AI FILM</a>
        </nav>
    </header>

    <main>
        <div id="film-detail-container">
        </div>
        <section class="screenings-section">
            <h3>Orari Spettacoli</h3>
            <div id="screenings-container">
            </div>
        </section>

        <div id="booking-modal" class="modal-backdrop" style="display: none;">
            <div class="modal-content">
                <button type="button" id="close-modal-btn" class="close-btn">&times;</button>
                <h2>PRENOTA IL TUO POSTO</h2>
                <p class="modal-subtitle">Compila il modulo per completare la prenotazione</p>

                <form id="booking-form">
                    <input type="hidden" id="selected-screening-id">

                    <div class="form-group">
                        <label for="input-nome">NOME</label>
                        <input type="text" id="input-nome" placeholder="es. Mario" required>
                    </div>

                    <div class="form-group">
                        <label for="input-cognome">COGNOME</label>
                        <input type="text" id="input-cognome" placeholder="es. Rossi" required>
                    </div>

                    <div class="form-group">
                        <label for="input-email">EMAIL</label>
                        <input type="email" id="input-email" placeholder="es. mario.rossi@email.com" required>
                    </div>

                    <button type="submit" class="submit-btn">Conferma prenotazione</button>
                </form>

                <p id="booking-message" class="booking-status"></p>
            </div>
        </div>

    </main>

    <script type="module" src="/src/dettaglio.ts"></script>
</body>

</html>
